<h1 class="scp-title" data-arg-slot="title">卷宗 · 测向交点</h1>
<div class="scp-body" data-arg-slot="body">两台测向机，同一时刻截到同一个不明信号。<br>灯塔方位 <b>217°</b>；港务雷达方位 <b>148°</b>。<br><br>在海图上从两个已知点各画一条方位线，交点就在那片海。<br>量出交点纬度、向下取整到度（例如 21°）——那是他们把船压进水里的纬度。</div>
