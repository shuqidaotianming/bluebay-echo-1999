<h1 class="scp-title" data-arg-slot="title">卷宗 · 船籍校验</h1>
<div class="scp-body" data-arg-slot="body">一串船籍号，末位是校验位，被人涂掉了。<br>格式：<b>H0722</b> ＋ 一位数字（Luhn 校验）。<br><br>把 0722 用 Luhn 算法补上正确的末位，才是它真正的注册号。<br>（从右起偶数位×2，>9 减 9，和能被 10 整除。）<br><br>末位是：<b>9</b>？——去档案里把它拼全。</div>
