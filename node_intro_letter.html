    <h2 class="diary-title" data-arg-slot="title">致 知微（若我没能回来）</h2>

    <div class="diary-content" data-arg-slot="body">
      知微：<br>如果你读到这封信，说明我已经“出海遇难”了。<br>那晚没有台风，海很平。是有人把整条船的人，连同我的麦克风，一起按进了水里。<br>FM 99.4——那是我七年夜夜守着、也骗了无数人的频率。听潮会说“潮水会带走诚实的人”，他们说到做到。<br>保险箱里，是我最后一次《潮声》。听完第九夜，替我把声音还给大海。<br><br>别信“陆上无尸即无事”。别信韩启昌。别信柯振师傅。<br>—— 哥<br><br>◈ 接下来： <a data-arg-link="打开保险箱">去试开保险箱</a> ｜ <a data-arg-link="联系记者">联系明月如霜</a> ｜ <a data-arg-link="去搜索这些词">去搜索哥哥留下的词</a> ｜ <a data-arg-link="返回桌面">← 返回桌面</a>
