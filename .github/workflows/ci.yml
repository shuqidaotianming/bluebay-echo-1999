name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 零依赖管线：无需 npm ci
      - name: Build (runtime bundle + search index)
        run: node scripts/build.mjs
      - name: Anti-bypass & integrity validation
        run: node scripts/validate.mjs
      - name: Unit tests
        run: node --test "tests/**/*.test.mjs"

  # 可选：构建通过则把静态站部署到 GitHub Pages（如需自动发布，取消注释并在仓库设置里开 Pages=Actions）
