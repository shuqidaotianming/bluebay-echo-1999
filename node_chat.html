<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>潮声通讯 · 端到端加密</title>
<style>* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background: var(--arg-bg-color, #f0f2f5);
  font-family: var(--arg-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft YaHei", sans-serif);
  height: 100vh;
  overflow: hidden;
}
.chat-app.wechat-theme {
  display: flex;
  height: 100vh;
  width: 100vw;
  background: #ffffff;
}
.chat-nav {
  width: 60px;
  background: #2e2e2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 16px;
  flex-shrink: 0;
}
.chat-nav-item {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  color: #999;
  transition: all 0.15s;
}
.chat-nav-item.active, .chat-nav-item:hover {
  background: rgba(255,255,255,0.15);
  color: #07c160;
}
.chat-sidebar {
  width: 250px;
  background: #f7f7f7;
  border-right: 1px solid #e6e6e6;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.chat-sidebar-header {
  padding: 14px;
  background: #f7f7f7;
  border-bottom: 1px solid #ebebeb;
}
.chat-search-bar {
  display: flex;
  align-items: center;
  background: #e9e9e9;
  border-radius: 4px;
  padding: 4px 8px;
  gap: 6px;
}
.chat-search-bar input {
  background: transparent;
  border: none;
  outline: none;
  font-size: 12px;
  width: 100%;
  color: #333;
}
.chat-contacts-list {
  flex: 1;
  overflow-y: auto;
}
.contact-item {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  gap: 10px;
  cursor: pointer;
  border-bottom: 1px solid #f0f0f0;
  transition: background 0.15s;
  position: relative;
}
.contact-item:hover {
  background: #ebebeb;
}
.contact-item.active {
  background: #c8e6c9;
}
.contact-avatar {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  background: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.contact-info {
  flex: 1;
  min-width: 0;
}
.contact-name {
  font-size: 14px;
  font-weight: 600;
  color: #1a1a1a;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.contact-last-msg {
  font-size: 12px;
  color: #888;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.contact-badge {
  background: #ff4d4f;
  color: #fff;
  font-size: 10px;
  border-radius: 10px;
  padding: 1px 6px;
  font-weight: bold;
}
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #f5f5f5;
}
.chat-header {
  height: 52px;
  background: #f7f7f7;
  border-bottom: 1px solid #e6e6e6;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chat-header-info {
  display: flex;
  align-items: center;
}
.chat-title-name {
  font-size: 16px;
  font-weight: bold;
  color: #222;
  margin-right: 8px;
}
.chat-title-bio {
  font-size: 12px;
  color: #888;
}
.chat-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.chat-header-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: #ffffff;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  color: #374151;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}
.chat-header-back-btn:hover {
  background: #f3f4f6;
  color: #111827;
  border-color: #9ca3af;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg-time-divider {
  text-align: center;
  font-size: 11px;
  color: #b2b2b2;
  margin: 4px 0;
}
.msg-row {
  display: flex;
  gap: 10px;
  max-width: 75%;
}
.msg-row.received, .msg-row.msg-npc {
  align-self: flex-start;
  margin-right: auto;
}
.msg-row.sent, .msg-row.msg-user {
  align-self: flex-end;
  margin-left: auto;
  flex-direction: row;
}
.msg-avatar {
  width: 36px;
  height: 36px;
  border-radius: 4px;
  background: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.msg-bubble {
  padding: 9px 13px;
  border-radius: 4px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
  position: relative;
}
.msg-row.received .msg-bubble, .msg-row.msg-npc .msg-bubble {
  background: #ffffff;
  color: #1f1f1f;
  border: 1px solid #e2e8f0;
}
.msg-row.sent .msg-bubble, .msg-row.msg-user .msg-bubble {
  background: var(--arg-primary-color, #95ec69);
  color: #000000;
}
.msg-bubble a, .msg-bubble .arg-link-item {
  color: #07c160;
  font-weight: bold;
  text-decoration: underline;
  cursor: pointer;
}
.chat-choices-area {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 18px;
  background: #fbfbfb;
  border-top: 1px dashed #e2e8f0;
}
.chat-choices-area:empty {
  display: none;
}
.choice-pill-btn {
  display: inline-flex;
  align-items: center;
  padding: 6px 14px;
  background: #ffffff;
  border: 1px solid #07c160;
  color: #07c160;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 2px 5px rgba(7, 193, 96, 0.1);
}
.choice-pill-btn:hover {
  background: #07c160;
  color: #ffffff;
}
.choice-pill-btn .pill-target {
  font-size: 10px;
  opacity: 0.8;
  margin-left: 6px;
}
.chat-input-area {
  background: #ffffff;
  border-top: 1px solid #e6e6e6;
  padding: 10px 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chat-toolbar {
  display: flex;
  gap: 12px;
  color: #777;
  font-size: 16px;
}
.tool-btn {
  cursor: pointer;
}
.chat-form {
  display: flex;
  gap: 10px;
  align-items: center;
}
.chat-form input {
  flex: 1;
  padding: 9px 12px;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  font-size: 14px;
  outline: none;
}
.chat-form input:focus {
  border-color: #07c160;
}
.chat-send-btn {
  padding: 8px 18px;
  background: #e9e9e9;
  color: #07c160;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.15s;
}
.chat-send-btn:hover {
  background: #07c160;
  color: #ffffff;
}

.contact-avatar img, .msg-avatar img, .avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
  display: block;
}

      </div>
    </div>

"doc_hanyang_speech,doc_ship_inspection","reply":"明月如霜：“筛选”……他们杀的不是命，是麻烦。这一条，值一版头条。"},{"text":"（追问）他从北边来——这条要写进人物侧写吗？","requires":"clue_callnorth","reply":"要。一个追了七年陌生小镇的人，比六个法人代表更能说明瀚洋到底在怕什么。"},{"text":"（追问）黑鳍号 1998 年就沉过一次。","requires":"clue_seaprovince","reply":"两案并一案。这不是历史重演，是同一条船、同一张网、第二次收网。见报那天，更名登记就是认罪书。"},{"text":"（追问）第二个满潮在白天——白天运的人，才是最贵的证据。","requires":"clue_secondtide","reply":"白班登记、无牌货车、三副哑掉的声带。这条补上，“流程合规”的辩护就塌了。"},{"text":"（追问）第九夜有个查无出处的频率。","requires":"clue_firstlight","reply":"无线电监测所说查无此频。可你的录音是真的。有些证据，只对找过它的人存在。"},{"text":"（追问）船的真名，叫黑鳍。","requires":"clue_blackfin","reply":"更名、注销、重登记、再出海——这条链一旦见报，瀚洋连“天灾”两个字都保不住。"},{"text":"（追问）三条对话线，合成一句话。","requires":"clue_callnorth,clue_seaprovince,clue_secondtide","reply":"明月如霜（轻声）：他从北边追到蓝湾，追了七年，替六十六个人记名。……这不是妹妹的调查。是他没做完的听众，终于开口了。"},{"text":"指认真凶——总工程师柯振：他装的模块、签的字、开的灯、切的话筒。","target":"end_true","requires":"doc_experiment,doc_subsidy,surv_port,transcript_tape,doc_ship_manifest,diary_shenyan2,doc_keeper_log,doc_raw_data,doc_weather_log","reply":"守塔人日志＋切断话筒的监控＋原始声学数据＋被涂改的气象簿……你指着柯振：灯，是你开的。明天头版印下所有名字。"},{"text":"把浮标信标的事告诉明月如霜。","requires":"clue_buoy","reply":"她把你的转述听了三遍：“这个信号，三年里我收到过四次，四次都被压下去。要让它变成新闻，我必须拿到完整的主链——白噪计划、资助协议、两路监控、名单、日记后半、守塔人日志、声学数据、气象原始簿。缺一样，我就不敢签名。集齐了，再回来找我。”"},{"text":"把暗流记录和救护记录一起推给她。","requires":"clue_buoy,clue_undertow","reply":"她盯着那三个圈看了很久：“活着的证人，比名单更重。可主链还差——差哪条，你手里的清单会告诉你。开完那些门，我陪你去敲警局的门。”"},{"text":"追问那个“仍在闪的浮标信标”。","target":"end_secret","requires":"doc_experiment,doc_subsidy,surv_port,transcript_tape,doc_ship_manifest,diary_shenyan2,doc_keeper_log,doc_raw_data,doc_weather_log,clue_buoy,clue_undertow","reply":"你循着浮标信标与暗流回卷的记录去了延盛外海……也许，海没有带走所有人。"},{"text":"把整台电台重新接回天线——用第九夜真正的开机频率，向全镇广播。","target":"end_signal","requires":"doc_experiment,doc_subsidy,surv_port,transcript_tape,doc_ship_manifest,diary_shenyan2,doc_keeper_log,doc_raw_data,doc_weather_log,clue_buoy,clue_undertow,clue_firstlight,clue_blackfin","reply":"你把天线重新架上塔顶，用 frequency_note 里那个只存在于地址栏的频率，接通了发射机。03:14，FM99.4 没有放白噪——放的是海，一整段海的呼吸。"},{"text":"（发稿）先发资金链，试探反应。","target":"press_money","requires":"news_hanyang,doc_subsidy","reply":"稿子出去了。三天后，瀚洋撤了我们的全部广告。主编没说话，把烟掐了。"},{"text":"（发稿）先发实验罪证，走科学口。","target":"press_science","requires":"doc_experiment,transcript_tape","reply":"学界吵翻了。有人说我们伪科学——可吵得越凶，知道的人越多。这一局，没输。"},{"text":"（发稿）全链一次发完，头版整版。","target":"press_full","requires":"doc_experiment,doc_subsidy,surv_port,transcript_tape,doc_ship_manifest,diary_shenyan2,doc_keeper_log,doc_raw_data,doc_weather_log","reply":"凌晨付印。排版间没有一个人说话，只听得见印刷机响。天亮了。"},{"text":"（调查板）把 3 月 14 日钉成一条完整的时间线。","target":"doc_timeline_full","requires":"doc_radio_log,doc_weather_log","reply":"来。把每一分钟都钉死——让“不清楚”这三个字，永远失效。"},{"text":"（见面）去报社，看看她的战场。","target":"node_newsroom","requires":"news_missingpeople","reply":"来吧。看看一份报纸，想在海上活下去有多难。"},{"text":"（名字墙）用整个头版，只印名字。","target":"end_wall","requires":"vic_shoe,vic_bunk,vic_ticket,vic_radio,vic_hairclip,vic_wage,vic_watch,vic_photo,vic_song,vic_kid_diary,vic_bottle,vic_medal,vic_hairband,vic_urn","reply":"这一版没有导语、没有分析，只有名字——从第一行，到第六十六行。"},{"text":"（纪念站）把六十六，放进地址栏。","target":"wall_memorial","requires":"clue_mem66","reply":"地址栏亮了。六十六盏灯，一盏一盘点起来。"}]},{"id":"c_zhou","name":"老周（广播站·退休技师）","bio":"IP 屏蔽中 · 只肯说方法","avatar":"🛠️","messages":[{"sender":"npc","text":"你哥从不把口令写在纸面。我只记得他的一些怪习惯，你自己品。"},{"sender":"npc","text":"保险箱那份，写在一张磁带标签上。他说潮水记性不好，东西都得往前推三格才存得住。"},{"sender":"npc","text":"机房那份，他不落明文，只留了一串\"等号结尾的乱码\"在工程便签里。他说，浏览器认得，人不认得。"},{"sender":"npc","text":"对了。他的执照备注栏写着一句话：\"我从北边来。\""},{"sender":"npc","text":"查查呼号分区手册（搜\"呼号\"）——华南的执照，他却用华东的呼号。他是哪个区的人？把那个数字，打字发给我。"}],"passphrase":"4,华东,bd4,四","passphraseReply":"华东……对。1996 年之前，他不在蓝湾。我把他调函里夹着的那份档案发给你。","passphraseClue":"clue_callnorth","passphraseTarget":"doc_shenyan_north","choices":[{"text":"你倒是说明白点。","reply":"不能再明白了。这份谨慎，是有人用命换的。"},{"text":"关于“他从北边来”，我还想再问一句。","requires":"clue_callnorth","reply":"……他调来蓝湾那年，往频率表的背面写了一行字。我一直没看懂——“等一个信号。等到它先开口。”现在你解到了这里，也许你懂了。"},{"text":"先去忙。","target":"node_desktop"}]},{"id":"c_anon","name":"未知号码 +0000-994","bio":"信号极弱 · 疑似来自海上","avatar":"📶","messages":[{"sender":"npc","text":"……别……听……白噪……"},{"sender":"npc","text":"延盛灯塔的灯，不是给船看的。他们照着海里。"},{"sender":"npc","text":"名单……瀚洋7号……_manifest……"},{"sender":"npc","text":"坐标……21°31′N 111°58′E……用真的地图查……那片海属于哪个省……打给我……"}],"passphrase":"广东,阳江,guangdong","passphraseReply":"广东……不。那不是他的海。他把信标标在离家最远的地方——因为黑鳍号第一次沉，就在那里。你看这份记录。","passphraseClue":"clue_seaprovince","passphraseTarget":"doc_far_sea","choices":[{"text":"去论坛问问“听潮会”","target":"node_forum"},{"text":"两片海……到底是什么关系？","requires":"clue_seaprovince","reply":"……同一张网……换了名字……再撒一次……1998……2000……下一个名字……（信号中断）"},{"text":"检索“延盛灯塔”","target":"news_lighthouse"}]},{"id":"c_yan","name":"沈砚（哥哥 · 离线？）","bio":"最后在线 2000-03-14","avatar":"🎙️","messages":[{"sender":"npc","text":"（自动回复）机主已离线。若您在收听，请打开保险箱，听完第九夜。"},{"sender":"npc","text":"（若您真的在收听）潮水一天两涨。我的海，03:14 满潮。查一查潮汐的规律——下一次满潮是几点？把小时数打给我，我就当你在。"}],"passphrase":"15,39,15:39,十五,下午3,下午3点","passphraseReply":"……15 点 39 分。第二个满潮在白天。白天运人，谁都看得见——所以谁都没看见。我把那天的记录留给你。","passphraseClue":"clue_secondtide","passphraseTarget":"doc_second_tide","choices":[{"text":"哥。第二个满潮夜，码头上有人看见你了吗？","requires":"clue_secondtide","reply":"（自动回复的末尾，多出了不属于程序的一行）……别在第二个满潮夜靠近码头。……这行字是谁加的？"},{"text":"回到桌面","target":"node_desktop"}]},{"id":"c_lu","name":"陆医生（镇卫生院 · 值班医生）","bio":"也是当年报案的那位\"陆某\"","avatar":"🩺","messages":[{"sender":"npc","text":"我知道你会来。你哥当年也这么站在我门口。"},{"sender":"npc","text":"先考你一件小事：那三个从礁石区抬回来的人，为什么不能说话？查了救护记录，再来答我。"}],"passphrase":"声带,嗓子,哑,声带损伤","passphraseReply":"对。不是吓的——是声带的问题，4.5 照过的后遗症。医院里没人敢把这句写进病历。……我弟弟，是名册第 9 行。现在，我的档案你都可以看了。","passphraseClue":"clue_lu_open","passphraseTarget":"doc_lu_truth","choices":[{"text":"当年为什么不立案？","requires":"clue_lu_open","reply":"立案要证据，证据会要人命。我选了我弟弟没等到的那条路：活着，等。现在你把证据等来了。"},{"text":"先去忙。","target":"node_desktop"}]},{"id":"c_hai","name":"海爷（老渔民）","bio":"延盛港 · 打了一辈子鱼","avatar":"⚓","messages":[{"sender":"npc","text":"黑鳍号？我认得，它进过船厂。\n考你一下：当年的加改装工单，编号是多少？查了船厂工单再来答我。"}],"passphrase":"h-0722,h0722,0722","passphraseReply":"对。H-0722。那天我就在坞边抽烟，看见帆布底下吊着的家伙——那不是渔具。\n我儿子在
