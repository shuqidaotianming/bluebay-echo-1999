<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>潮声通讯 · 端到端加密</title>
<style>* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background: var(--arg-bg-color, #f0f2f5);
  font-family: var(--arg-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft YaHei", sans-serif);
  height: 100vh;
  overflow: hidden;
}
.chat-app.wechat-theme {
  display: flex;
  height: 100vh;
  width: 100vw;
  background: #ffffff;
}
.chat-nav {
  width: 60px;
  background: #2e2e2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 16px;
  flex-shrink: 0;
}
.chat-nav-item {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  color: #999;
  transition: all 0.15s;
}
.chat-nav-item.active, .chat-nav-item:hover {
  background: rgba(255,255,255,0.15);
  color: #07c160;
}
.chat-sidebar {
  width: 250px;
  background: #f7f7f7;
  border-right: 1px solid #e6e6e6;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.chat-sidebar-header {
  padding: 14px;
  background: #f7f7f7;
  border-bottom: 1px solid #ebebeb;
}
.chat-search-bar {
  display: flex;
  align-items: center;
  background: #e9e9e9;
  border-radius: 4px;
  padding: 4px 8px;
  gap: 6px;
}
.chat-search-bar input {
  background: transparent;
  border: none;
  outline: none;
  font-size: 12px;
  width: 100%;
  color: #333;
}
.chat-contacts-list {
  flex: 1;
  overflow-y: auto;
}
.contact-item {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  gap: 10px;
  cursor: pointer;
  border-bottom: 1px solid #f0f0f0;
  transition: background 0.15s;
  position: relative;
}
.contact-item:hover {
  background: #ebebeb;
}
.contact-item.active {
  background: #c8e6c9;
}
.contact-avatar {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  background: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.contact-info {
  flex: 1;
  min-width: 0;
}
.contact-name {
  font-size: 14px;
  font-weight: 600;
  color: #1a1a1a;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.contact-last-msg {
  font-size: 12px;
  color: #888;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.contact-badge {
  background: #ff4d4f;
  color: #fff;
  font-size: 10px;
  border-radius: 10px;
  padding: 1px 6px;
  font-weight: bold;
}
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #f5f5f5;
}
.chat-header {
  height: 52px;
  background: #f7f7f7;
  border-bottom: 1px solid #e6e6e6;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chat-header-info {
  display: flex;
  align-items: center;
}
.chat-title-name {
  font-size: 16px;
  font-weight: bold;
  color: #222;
  margin-right: 8px;
}
.chat-title-bio {
  font-size: 12px;
  color: #888;
}
.chat-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.chat-header-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: #ffffff;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  color: #374151;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}
.chat-header-back-btn:hover {
  background: #f3f4f6;
  color: #111827;
  border-color: #9ca3af;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg-time-divider {
  text-align: center;
  font-size: 11px;
  color: #b2b2b2;
  margin: 4px 0;
}
.msg-row {
  display: flex;
  gap: 10px;
  max-width: 75%;
}
.msg-row.received, .msg-row.msg-npc {
  align-self: flex-start;
  margin-right: auto;
}
.msg-row.sent, .msg-row.msg-user {
  align-self: flex-end;
  margin-left: auto;
  flex-direction: row;
}
.msg-avatar {
  width: 36px;
  height: 36px;
  border-radius: 4px;
  background: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.msg-bubble {
  padding: 9px 13px;
  border-radius: 4px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
  position: relative;
}
.msg-row.received .msg-bubble, .msg-row.msg-npc .msg-bubble {
  background: #ffffff;
  color: #1f1f1f;
  border: 1px solid #e2e8f0;
}
.msg-row.sent .msg-bubble, .msg-row.msg-user .msg-bubble {
  background: var(--arg-primary-color, #95ec69);
  color: #000000;
}
.msg-bubble a, .msg-bubble .arg-link-item {
  color: #07c160;
  font-weight: bold;
  text-decoration: underline;
  cursor: pointer;
}
.chat-choices-area {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 18px;
  background: #fbfbfb;
  border-top: 1px dashed #e2e8f0;
}
.chat-choices-area:empty {
  display: none;
}
.choice-pill-btn {
  display: inline-flex;
  align-items: center;
  padding: 6px 14px;
  background: #ffffff;
  border: 1px solid #07c160;
  color: #07c160;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 2px 5px rgba(7, 193, 96, 0.1);
}
.choice-pill-btn:hover {
  background: #07c160;
  color: #ffffff;
}
.choice-pill-btn .pill-target {
  font-size: 10px;
  opacity: 0.8;
  margin-left: 6px;
}
.chat-input-area {
  background: #ffffff;
  border-top: 1px solid #e6e6e6;
  padding: 10px 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chat-toolbar {
  display: flex;
  gap: 12px;
  color: #777;
  font-size: 16px;
}
.tool-btn {
  cursor: pointer;
}
.chat-form {
  display: flex;
  gap: 10px;
  align-items: center;
}
.chat-form input {
  flex: 1;
  padding: 9px 12px;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  font-size: 14px;
  outline: none;
}
.chat-form input:focus {
  border-color: #07c160;
}
.chat-send-btn {
  padding: 8px 18px;
  background: #e9e9e9;
  color: #07c160;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.15s;
}
.chat-send-btn:hover {
  background: #07c160;
  color: #ffffff;
}

.contact-avatar img, .msg-avatar img, .avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
  display: block;
}

      z-index: 99998;
    }
    .arg-atmosphere-glitch {
      animation: arg-glitch-flicker 4s infinite;
    }
    .arg-redacted {

      98% { filter: none; }
    }

      </div>
    </div>
  </div>

这套讲给陪审团，他们才听得懂那晚的人为什么“自愿”。这一条，记下了。"},{"text":"（推演·动机）不是仪式，是“筛选”——杀人是为了省钱省事。","requires":"doc_hanyang_speech,doc_ship_inspection","reply":"明月如霜：“筛选”……他们杀的不是命，是麻烦。这一条，值一版头条。"},{"text":"（追问）他从北边来——这条要写进人物侧写吗？","requires":"clue_callnorth","reply":"要。一个追了七年陌生小镇的人，比六个法人代表更能说明瀚洋到底在怕什么。"},{"text":"（追问）黑鳍号 1998 年就沉过一次。","requires":"clue_seaprovince","reply":"两案并一案。这不是历史重演，是同一条船、同一张网、第二次收网。见报那天，更名登记就是认罪书。"},{"text":"（追问）第二个满潮在白天——白天运的人，才是最贵的证据。","requires":"clue_secondtide","reply":"白班登记、无牌货车、三副哑掉的声带。这条补上，“流程合规”的辩护就塌了。"},{"text":"（追问）第九夜有个查无出处的频率。","requires":"clue_firstlight","reply":"无线电监测所说查无此频。可你的录音是真的。有些证据，只对找过它的人存在。"},{"text":"（追问）船的真名，叫黑鳍。","requires":"clue_blackfin","reply":"更名、注销、重登记、再出海——这条链一旦见报，瀚洋连“天灾”两个字都保不住。"},{"text":"（追问）三条对话线，合成一句话。","requires":"clue_callnorth,clue_seaprovince,clue_secondtide","reply":"明月如霜（轻声）：他从北边追到蓝湾，追了七年，替六十六个人记名。……这不是妹妹的调查。是他没做完的听众，终于开口了。"},{"text":"指认真凶——总工程师柯振：他装的模块、签的字、开的灯、切的话筒。","target":"end_true","requires":"doc_experiment,doc_subsidy,surv_port,transcript_tape,doc_ship_manifest,diary_shenyan2,doc_keeper_log,doc_raw_data,doc_weather_log","reply":"守塔人日志＋切断话筒的监控＋原始声学数据＋被涂改的气象簿……你指着柯振：灯，是你开的。明天头版印下所有名字。"},{"text":"追问那个“仍在闪的浮标信标”。","target":"end_secret","requires":"doc_experiment,doc_subsidy,surv_port,transcript_tape,doc_ship_manifest,diary_shenyan2,doc_keeper_log,doc_raw_data,doc_weather_log,clue_buoy,clue_undertow","reply":"你循着浮标信标与暗流回卷的记录去了延盛外海……也许，海没有带走所有人。"},{"text":"把整台电台重新接回天线——用第九夜真正的开机频率，向全镇广播。","target":"end_signal","requires":"doc_experiment,doc_subsidy,surv_port,transcript_tape,doc_ship_manifest,diary_shenyan2,doc_keeper_log,doc_raw_data,doc_weather_log,clue_buoy,clue_undertow,clue_firstlight,clue_blackfin","reply":"你把天线重新架上塔顶，用 frequency_note 里那个只存在于地址栏的频率，接通了发射机。03:14，FM99.4 没有放白噪——放的是海，一整段海的呼吸。"}]},{"id":"c_zhou","name":"老周（广播站·退休技师）","bio":"IP 屏蔽中 · 只肯说方法","avatar":"🛠️","messages":[{"sender":"npc","text":"你哥从不把口令写在纸面。我只记得他的一些怪习惯，你自己品。"},{"sender":"npc","text":"保险箱那份，写在一张磁带标签上。他说潮水记性不好，东西都得往前推三格才存得住。"},{"sender":"npc","tex
