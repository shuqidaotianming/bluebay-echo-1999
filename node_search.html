}
.yahoo-container {

.search-input-box { display: flex; width: 100%; max-width: 520px; gap: 8px; }
.search-input-box input {
  flex: 1; padding: 8px 12px; border: 2px solid #5a009d; font-size: 14px; outline: none;
}
.yahoo-btn {
  background: #5a009d; color: #fff; border: none; padding: 8px 20px;
  font-size: 14px; font-weight: bold; cursor: pointer;
}
.yahoo-btn:hover { background: #7b0dbd; }
.yahoo-hot-links {
  background: #fdf5e6; border: 1px solid #faebcc; padding: 8px 12px;
  font-size: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px;
}
.hot-link-btn { color: #0000cc; font-weight: bold; text-decoration: underline; cursor: pointer; }
.yahoo-result-box {
  margin: 12px 0; font-size: 14px; font-weight: bold; color: #cc0000; text-align: center;
}
.yahoo-directory {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px;
  border-top: 2px solid #5a009d; padding-top: 16px; margin-top: 20px;
}
.dir-col h4 { margin: 0 0 4px 0; font-size: 13px; color: #5a009d; }
.dir-col p { margin: 0; font-size: 11px; color: #666; }
